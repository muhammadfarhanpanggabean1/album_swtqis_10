<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pendaftaran Email · Album SWTQIS-10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<!--
  Data diterima oleh Google Apps Script (lihat berkas Kode.gs).
  Alurnya dua langkah:
    1. Formulir dikirim -> skrip mengirim kode 6 angka ke email pendaftar.
    2. Pendaftar memasukkan kode -> skrip mencatat ke Google Sheets.
  Email yang tidak pernah menerima kode tidak akan tercatat.
-->
<style>
  :root{
    --cream:#FDEEE0;
    --paper:#FFFAF6;
    --brown:#5A463B;
    --brown-soft:#7A6253;
    --blue:#9DD2F2;
    --blue-wash:#D2E2E8;
    --peach:#FAD9C1;
    --error:#B3402A;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    background:var(--cream);color:var(--brown);
    font-family:var(--sans);font-size:17px;line-height:1.5;
    padding:calc(32px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
  body::before{width:min(150vw,720px);aspect-ratio:1;left:-38%;top:-12%;background:var(--blue-wash)}
  body::after{width:min(110vw,520px);aspect-ratio:1;right:-48%;bottom:-16%;background:var(--peach)}
  main{max-width:460px;margin:0 auto}
  h1{
    font-family:var(--serif);font-weight:700;font-size:clamp(2.5rem,12vw,3.4rem);
    line-height:1.02;letter-spacing:-.01em;margin:8px 0 12px;
  }
  .lead{margin:0 0 26px;font-weight:600;font-size:1.05rem;max-width:30ch}
  .lead strong{font-weight:800;word-break:break-all}
  .card{
    background:var(--paper);border:4px solid var(--brown);border-radius:30px;
    padding:26px 22px 24px;box-shadow:0 18px 40px -16px rgba(90,70,59,.35);
  }
  .field{margin-bottom:20px}
  label{display:block;font-weight:800;font-size:1rem;margin-bottom:2px}
  .hint{display:block;font-size:.88rem;font-weight:600;color:var(--brown-soft);margin-bottom:8px}
  input[type=text],input[type=email]{
    width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--brown);
    background:var(--cream);border:2px solid transparent;border-radius:16px;
    padding:14px 16px;outline:none;transition:border-color .15s,background-color .15s;
  }
  #otp{text-align:center;font-size:1.5rem;font-weight:800;letter-spacing:.35em;padding-left:calc(16px + .35em)}
  #otp::placeholder{letter-spacing:.35em}
  input::placeholder{color:#B09A8C;font-weight:500}
  input:focus-visible{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(157,210,242,.45)}
  input[aria-invalid=true]{border-color:var(--error)}
  .err{display:none;margin-top:6px;font-size:.88rem;font-weight:700;color:var(--error)}
  input[aria-invalid=true] ~ .err{display:block}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button{
    width:100%;font:inherit;font-weight:800;font-size:1.08rem;color:var(--brown);
    background:var(--blue);border:0;border-radius:999px;padding:16px 20px;margin-top:6px;
    cursor:pointer;transition:transform .12s,filter .15s;
  }
  button.alt{
    background:transparent;border:2px solid var(--brown);font-size:1rem;
    padding:13px 20px;margin-top:12px;
  }
  button:hover{filter:brightness(.97)}
  button:active{transform:scale(.98)}
  button:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
  button[disabled]{opacity:.55;cursor:default}
  .status{min-height:1.4em;margin:14px 2px 0;font-size:.92rem;font-weight:700;color:var(--error)}
  .status.ok{color:var(--brown-soft)}
  .done h2{font-family:var(--serif);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0 0 10px}
  .done p{margin:0 0 10px;font-weight:600}
  .done strong{font-weight:800;word-break:break-all}
  .gate .card{margin-top:8px}
  .gate h2{font-family:var(--serif);font-size:1.7rem;line-height:1.1;margin:0 0 10px}
  .gate p{margin:0;font-weight:600}
  /* penanda langkah */
  .langkah{
    list-style:none;margin:0 auto 22px;padding:0;max-width:460px;
    display:flex;justify-content:space-between;position:relative;--pn:0;
  }
  .langkah::before,.langkah::after{content:"";position:absolute;top:15px;left:32px;height:4px;border-radius:2px}
  .langkah::before{right:32px;background:rgba(90,70,59,.18)}
  .langkah::after{width:calc((100% - 64px) * var(--pn));background:var(--brown);transition:width .6s cubic-bezier(.3,.7,.2,1)}
  .langkah li{
    width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;
    position:relative;z-index:1;font-size:.78rem;font-weight:800;color:var(--brown-soft);
    transition:color .3s;
  }
  .langkah li span{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:var(--paper);border:3px solid rgba(90,70,59,.3);font-size:.95rem;
    transition:background-color .3s,border-color .3s,color .3s,transform .3s;
  }
  .langkah li.aktif,.langkah li.selesai{color:var(--brown)}
  .langkah li.aktif span{background:var(--blue);border-color:var(--brown);transform:scale(1.12)}
  .langkah li.selesai span{background:var(--brown);border-color:var(--brown);color:var(--paper)}

  /* centang di layar selesai */
  .centang{display:block;margin:0 0 12px}

  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
    h1,.lead{animation:naik .5s cubic-bezier(.2,.7,.2,1) both}
    .lead{animation-delay:.08s}
    .card > *{animation:naik .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 80ms + .18s)}
    .card > *:nth-child(1){--i:0}
    .card > *:nth-child(2){--i:1}
    .card > *:nth-child(3){--i:2}
    .card > *:nth-child(4){--i:3}
    .card > *:nth-child(5){--i:4}
    .card > *:nth-child(6){--i:5}
    .card > *:nth-child(7){--i:6}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes naik{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    #app{transition:opacity .22s ease,transform .22s ease}
    #app.keluar{opacity:0;transform:translateX(-26px)}
    .langkah li.aktif span{animation:denyut 1.6s ease-out infinite}
    @keyframes denyut{
      0%{box-shadow:0 0 0 0 rgba(157,210,242,.9)}
      100%{box-shadow:0 0 0 12px rgba(157,210,242,0)}
    }
    .centang circle{stroke-dasharray:145;stroke-dashoffset:145;animation:gambar .7s .15s ease forwards}
    .centang path{stroke-dasharray:40;stroke-dashoffset:40;animation:gambar .4s .75s ease forwards}
    @keyframes gambar{to{stroke-dashoffset:0}}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<noscript><main><h1>Aktifkan JavaScript</h1><p class="lead">Halaman ini membutuhkan JavaScript untuk berjalan.</p></main></noscript>

<script>
(function(){
  "use strict";

  /* Alamat /exec dari Google Apps Script penerima data (lihat Kode.gs). */
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbwQ1cKM3-lgEKSqa3Be0ll8zG9leMx_PLbRuhXAOjYM4FeLbxhk719yvI-Eqkl1__Sl/exec";
  var JEDA_ULANG = 60; /* detik, samakan dengan JEDA_KIRIM_DETIK di Kode.gs */

  var app = document.getElementById("app");

  /* Hanya browser bawaan Instagram yang menyertakan kata "Instagram" di user agent. */
  var ua = navigator.userAgent || "";
  var inInstagram = /Instagram/i.test(ua);

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var timer = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* Kirim satu permintaan ke Apps Script, hasilnya teks balasan huruf kecil. */
  function kirim(payload){
    return fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.text();
    }).then(function(teks){
      return String(teks).trim().toLowerCase();
    });
  }

  if(!inInstagram){
    app.className = "gate";
    app.innerHTML =
      '<h1>Buka lewat Instagram</h1>' +
      '<div class="card"><h2>Halaman ini tidak tersedia di browser ini</h2>' +
      '<p>Pendaftaran email hanya bisa dibuka dari dalam browser Instagram. Buka tautannya dari Instagram, lalu coba lagi.</p></div>';
    return;
  }

  /* ---------- Penanda langkah & perpindahan layar ---------- */
  var NAMA_LANGKAH = ["Data", "Verifikasi", "Selesai"];
  var nav = document.createElement("ol");
  nav.className = "langkah";
  nav.setAttribute("aria-label", "Tahapan pendaftaran");
  nav.innerHTML = NAMA_LANGKAH.map(function(n, i){
    return '<li><span>' + (i + 1) + '</span>' + n + '</li>';
  }).join("");
  app.parentNode.insertBefore(nav, app);
  var titik = nav.getElementsByTagName("li");

  /* n = 1..3 langkah aktif; 4 = semua langkah selesai */
  function setLangkah(n){
    nav.style.setProperty("--pn", String(Math.min(n - 1, 2) / 2));
    for(var i = 0; i < titik.length; i++){
      var no = i + 1;
      titik[i].className = no < n ? "selesai" : (no === n ? "aktif" : "");
      titik[i].firstChild.textContent = no < n ? "✓" : String(no);
      if(no === n){ titik[i].setAttribute("aria-current", "step"); }
      else{ titik[i].removeAttribute("aria-current"); }
    }
  }

  /* Layar lama bergeser keluar, layar baru muncul bertahap. */
  function pindah(buat, n){
    app.classList.add("keluar");
    setLangkah(n);
    setTimeout(function(){
      buat();
      app.classList.remove("keluar");
      window.scrollTo(0, 0);
    }, 230);
  }

  /* ---------- Langkah 1: formulir ---------- */
  function renderForm(isi){
    isi = isi || {};
    if(timer){ clearInterval(timer); timer = null; }

    app.innerHTML =
      '<h1>Pendaftaran email</h1>' +
      '<p class="lead">Daftarkan emailmu untuk masuk ke Album SWTQIS-10.</p>' +
      '<form class="card" id="form" novalidate autocomplete="on">' +
        '<div class="field">' +
          '<label for="nama">Nama lengkap</label>' +
          '<input type="text" id="nama" name="nama" autocomplete="name" autocapitalize="words" placeholder="Nama lengkapmu" required>' +
          '<span class="err" id="e-nama">Isi nama lengkap.</span>' +
        '</div>' +
        '<div class="field">' +
          '<label for="kode">Kode masuk akun Instagram</label>' +
          '<span class="hint">Kode dari akun Instagram @angkatan 10 swtqis.</span>' +
          '<input type="text" id="kode" name="kode" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Kode masuk" required>' +
          '<span class="err" id="e-kode">Isi kode masuk.</span>' +
        '</div>' +
        '<div class="field">' +
          '<label for="email">Email</label>' +
          '<span class="hint">Email pribadi yang aktif. Kode verifikasi akan dikirim ke sini.</span>' +
          '<input type="email" id="email" name="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nama@email.com" required>' +
          '<span class="err" id="e-email">Isi email dengan benar, contoh nama@email.com.</span>' +
        '</div>' +
        '<div class="hp" aria-hidden="true"><label>Jangan diisi<input type="text" id="situs" name="situs" tabindex="-1" autocomplete="off"></label></div>' +
        '<button type="submit" id="kirim">Kirim kode verifikasi</button>' +
        '<p class="status" id="status" role="status" aria-live="polite"></p>' +
      '</form>';

    var form = document.getElementById("form");
    var btn = document.getElementById("kirim");
    var statusEl = document.getElementById("status");
    var fields = {
      nama:  document.getElementById("nama"),
      kode:  document.getElementById("kode"),
      email: document.getElementById("email")
    };
    fields.nama.value  = isi.nama  || "";
    fields.kode.value  = isi.kode  || "";
    fields.email.value = isi.email || "";

    var DEFAULT_ERR = {
      nama:  "Isi nama lengkap.",
      kode:  "Isi kode masuk.",
      email: "Isi email dengan benar, contoh nama@email.com."
    };
    function setErr(key, msg){
      document.getElementById("e-" + key).textContent = msg;
      fields[key].setAttribute("aria-invalid", "true");
      fields[key].focus();
    }
    function check(key){
      document.getElementById("e-" + key).textContent = DEFAULT_ERR[key];
      var v = fields[key].value.trim();
      var ok = key === "email" ? EMAIL_RE.test(v) : v.length > 0;
      fields[key].setAttribute("aria-invalid", ok ? "false" : "true");
      return ok;
    }
    Object.keys(fields).forEach(function(k){
      fields[k].addEventListener("input", function(){
        if(fields[k].getAttribute("aria-invalid") === "true") check(k);
      });
      fields[k].addEventListener("blur", function(){
        if(fields[k].value !== "") check(k);
      });
    });

    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      statusEl.textContent = "";

      var first = null;
      ["nama","kode","email"].forEach(function(k){
        if(!check(k) && !first) first = fields[k];
      });
      if(first){ first.focus(); return; }

      if(document.getElementById("situs").value){ return; } /* jebakan bot */

      var data = {
        nama:  fields.nama.value.trim(),
        kode:  fields.kode.value.trim(),
        email: fields.email.value.trim().toLowerCase()
      };

      btn.disabled = true;
      btn.textContent = "Mengirim kode…";

      function reset(){
        btn.disabled = false;
        btn.textContent = "Kirim kode verifikasi";
      }

      kirim({aksi: "daftar", nama: data.nama, kode: data.kode, email: data.email})
      .then(function(balasan){
        if(balasan === "kode terkirim" || balasan === "tunggu"){
          pindah(function(){
            renderVerifikasi(data, balasan === "tunggu"
              ? "Kode sudah dikirim barusan. Cek emailmu."
              : "");
          }, 2);
          return;
        }
        reset();
        if(balasan === "kode salah"){
          setErr("kode", "Kode masuk salah. Periksa lagi kodenya.");
        }else if(balasan === "email sudah terdaftar"){
          setErr("email", "Email ini sudah terdaftar. Pakai email lain.");
        }else if(balasan === "data tidak lengkap"){
          statusEl.textContent = "Data belum lengkap. Periksa ketiga kolom, lalu kirim lagi.";
        }else if(balasan === "gagal kirim email"){
          setErr("email", "Kode tidak bisa dikirim ke email ini. Periksa penulisannya.");
        }else if(balasan === "kuota habis"){
          statusEl.textContent = "Pengiriman kode hari ini sudah penuh. Coba lagi besok.";
        }else{
          statusEl.textContent = "Belum berhasil. " + (balasan.indexOf("galat") === 0 ? balasan : "Coba kirim lagi sebentar lagi.");
        }
      }).catch(function(){
        reset();
        statusEl.textContent = "Gagal terkirim. Periksa koneksi internetmu, lalu kirim lagi.";
      });
    });
  }

  /* ---------- Langkah 2: masukkan kode dari email ---------- */
  function renderVerifikasi(data, pesanAwal){
    if(timer){ clearInterval(timer); timer = null; }

    app.innerHTML =
      '<h1>Cek emailmu</h1>' +
      '<p class="lead">Kami mengirim kode 6 angka ke <strong>' + esc(data.email) + '</strong>. Cek juga folder Spam.</p>' +
      '<form class="card" id="vform" novalidate>' +
        '<div class="field">' +
          '<label for="otp">Kode verifikasi</label>' +
          '<input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="000000" required>' +
          '<span class="err" id="e-otp">Isi 6 angka kode dari emailmu.</span>' +
        '</div>' +
        '<button type="submit" id="vkirim">Verifikasi</button>' +
        '<button type="button" class="alt" id="ulang" disabled>Kirim ulang kode</button>' +
        '<button type="button" class="alt" id="ganti">Ganti email</button>' +
        '<p class="status ok" id="vstatus" role="status" aria-live="polite"></p>' +
      '</form>';

    var vform = document.getElementById("vform");
    var vbtn = document.getElementById("vkirim");
    var ulang = document.getElementById("ulang");
    var ganti = document.getElementById("ganti");
    var otpEl = document.getElementById("otp");
    var vstatus = document.getElementById("vstatus");

    function pesan(teks, galat){
      vstatus.className = "status" + (galat ? "" : " ok");
      vstatus.textContent = teks;
    }
    pesan(pesanAwal || "", false);

    function mulaiHitung(detik){
      if(timer){ clearInterval(timer); }
      var sisa = detik;
      function tampil(){
        if(sisa > 0){
          ulang.disabled = true;
          ulang.textContent = "Kirim ulang kode (" + sisa + ")";
        }else{
          ulang.disabled = false;
          ulang.textContent = "Kirim ulang kode";
          clearInterval(timer);
          timer = null;
        }
      }
      tampil();
      timer = setInterval(function(){ sisa--; tampil(); }, 1000);
    }
    mulaiHitung(JEDA_ULANG);

    otpEl.addEventListener("input", function(){
      otpEl.value = otpEl.value.replace(/\D/g, "").slice(0, 6);
      otpEl.setAttribute("aria-invalid", "false");
    });
    otpEl.focus();

    ganti.addEventListener("click", function(){
      pindah(function(){
        renderForm({nama: data.nama, kode: data.kode, email: ""});
      }, 1);
    });

    ulang.addEventListener("click", function(){
      ulang.disabled = true;
      pesan("Mengirim kode baru…", false);
      kirim({aksi: "daftar", nama: data.nama, kode: data.kode, email: data.email})
      .then(function(balasan){
        if(balasan === "kode terkirim"){
          pesan("Kode baru sudah dikirim. Pakai kode yang terbaru.", false);
          mulaiHitung(JEDA_ULANG);
        }else if(balasan === "tunggu"){
          pesan("Tunggu sebentar sebelum mengirim ulang.", true);
          mulaiHitung(JEDA_ULANG);
        }else if(balasan === "email sudah terdaftar"){
          pesan("Email ini sudah terdaftar.", true);
        }else if(balasan === "kuota habis"){
          pesan("Pengiriman kode hari ini sudah penuh. Coba lagi besok.", true);
        }else if(balasan === "gagal kirim email"){
          pesan("Kode tidak bisa dikirim ke email ini. Pilih Ganti email.", true);
        }else{
          pesan("Belum berhasil. Coba lagi sebentar lagi.", true);
          ulang.disabled = false;
        }
      }).catch(function(){
        pesan("Gagal terkirim. Periksa koneksi internetmu.", true);
        ulang.disabled = false;
      });
    });

    vform.addEventListener("submit", function(ev){
      ev.preventDefault();
      var otp = otpEl.value.trim();
      if(!/^\d{6}$/.test(otp)){
        otpEl.setAttribute("aria-invalid", "true");
        document.getElementById("e-otp").textContent = "Isi 6 angka kode dari emailmu.";
        otpEl.focus();
        return;
      }
      pesan("", false);
      vbtn.disabled = true;
      vbtn.textContent = "Memeriksa…";

      function reset(){
        vbtn.disabled = false;
        vbtn.textContent = "Verifikasi";
      }

      kirim({aksi: "verifikasi", email: data.email, otp: otp})
      .then(function(balasan){
        if(balasan === "ok"){
          if(timer){ clearInterval(timer); timer = null; }
          pindah(function(){
            app.innerHTML =
              '<h1>Terima kasih</h1>' +
              '<div class="card done">' +
                '<svg class="centang" viewBox="0 0 52 52" width="76" height="76" aria-hidden="true">' +
                  '<circle cx="26" cy="26" r="23" fill="none" stroke="#9DD2F2" stroke-width="4"/>' +
                  '<path d="M15 27l8 8 14-16" fill="none" stroke="#5A463B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>' +
                '</svg>' +
                '<h2>Emailmu sudah terverifikasi</h2>' +
                '<p>' + esc(data.nama) + ', emailmu <strong>' + esc(data.email) + '</strong> sudah tercatat.</p>' +
                '<p>Gunakan email ini saat masuk ke Album SWTQIS-10.</p>' +
              '</div>';
          }, 4);
          return;
        }
        reset();
        if(balasan === "otp salah"){
          otpEl.setAttribute("aria-invalid", "true");
          document.getElementById("e-otp").textContent = "Kode salah. Periksa lagi kodenya.";
          otpEl.focus();
        }else if(balasan === "otp kedaluwarsa"){
          pesan("Kode sudah kedaluwarsa atau terlalu sering salah. Kirim ulang kode.", true);
          if(timer){ clearInterval(timer); timer = null; }
          ulang.disabled = false;
          ulang.textContent = "Kirim ulang kode";
        }else if(balasan === "email sudah terdaftar"){
          pesan("Email ini sudah terdaftar. Pilih Ganti email.", true);
        }else{
          pesan("Belum berhasil. " + (balasan.indexOf("galat") === 0 ? balasan : "Coba lagi sebentar lagi."), true);
        }
      }).catch(function(){
        reset();
        pesan("Gagal terkirim. Periksa koneksi internetmu, lalu coba lagi.", true);
      });
    });
  }

  setLangkah(1);
  renderForm();
})();
</script>
